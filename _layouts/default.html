<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y4dc51rhbh");
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">Tuam Records Project
        <small>Documents &middot; Claims &middot; Source Evidence</small>
      </a>
      <form class="header-search" action="{{ '/search/' | relative_url }}" method="get" role="search">
        <input type="search" name="q" placeholder="Search the archive&hellip;" aria-label="Search the archive">
        <button type="submit" aria-label="Search">Search</button>
      </form>
    </div>
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <div id="clarity-consent" class="clarity-consent" hidden>
    <p>This site uses Microsoft Clarity to count visitors. In Ireland, Clarity needs your OK before it can record a visit.</p>
    <button type="button" id="clarity-consent-allow" class="btn btn-primary">Allow</button>
    <button type="button" id="clarity-consent-deny" class="btn">No thanks</button>
  </div>
  <script>
    (function () {
      function tellClarity(granted) {
        if (typeof window.clarity !== "function") return;
        window.clarity("consentv2", {
          ad_Storage: "denied",
          analytics_Storage: granted ? "granted" : "denied"
        });
      }

      var key = "trp-clarity-consent";
      var saved = null;
      try { saved = localStorage.getItem(key); } catch (e) {}

      if (saved === "granted") {
        tellClarity(true);
        return;
      }
      if (saved === "denied") {
        tellClarity(false);
        return;
      }

      var bar = document.getElementById("clarity-consent");
      var allow = document.getElementById("clarity-consent-allow");
      var deny = document.getElementById("clarity-consent-deny");
      if (!bar || !allow || !deny) return;

      bar.hidden = false;

      allow.addEventListener("click", function () {
        try { localStorage.setItem(key, "granted"); } catch (e) {}
        tellClarity(true);
        bar.hidden = true;
      });

      deny.addEventListener("click", function () {
        try { localStorage.setItem(key, "denied"); } catch (e) {}
        tellClarity(false);
        bar.hidden = true;
      });
    })();
  </script>
</body>
</html>
